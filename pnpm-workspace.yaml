packages:
  - "runtime/wasmfs-idb"
  - "modules/glib/checks/tests"
  - "tests/spikes/*"
  - "packages/*"

# What must be one version across the repository. Packages name these as
# `catalog:`, never with a version of their own.
catalog:
  "@types/node": ^24.19.0
  # Exactly nixpkgs' playwright-driver, whose browsers it drives.
  playwright: 1.63.0
  typescript: ^7.0.2
  vitest: ^5.0.3
  "@vitest/browser": ^5.0.3
  "@vitest/browser-playwright": ^5.0.3
  jsonc-parser: ^3.3.1
  smol-toml: ^1.9.0
