# name = "why no part of it can run on Emscripten"
[excluded]
"gio - glib:gdbus-server-auth" = "every subtest runs a D-Bus server on a socket (WasmFS has no sockets: socket() fails with ENOSYS); the two EXTERNAL subtests skip anyway, having no credentials to pass"
"gio - glib:iptosmessage" = "both subtests send a control message over a UDP socket (WasmFS has no sockets: socket() fails with ENOSYS)"
"gio - glib:proxy-test" = "main() starts its proxy and server threads on listening sockets before any subtest runs (WasmFS has no sockets: socket() fails with ENOSYS)"
"gio - glib:socket-listener" = "two subtests listen on sockets (WasmFS has no sockets: socket() fails with ENOSYS); the two listen-failure subtests inject failures into real socket calls, through dlsym(RTLD_NEXT) mocks that find nothing in a static WebAssembly link"
"gio - glib:socket-service" = "every subtest listens on a socket (WasmFS has no sockets: socket() fails with ENOSYS)"
"glib+core - glib:io-channel-basic" = "starts its children with system(), expecting them to inherit pipe fds; Emscripten can't spawn processes, and under Node system() runs a host shell that sees none of WasmFS's fds"
"glib+core - glib:protocol" = "its two tests read the log protocol from copies of itself that they spawn, and Emscripten can't spawn processes; the other seven are the copies' bodies and do nothing otherwise"
"glib+core - glib:spawn-multithreaded" = "every subtest spawns processes, and Emscripten can't spawn processes"
"glib+core - glib:spawn-path-search" = "every subtest spawns processes, and Emscripten can't spawn processes"
"glib+core - glib:spawn-singlethread" = "every subtest spawns processes, and Emscripten can't spawn processes"
"glib+core - glib:spawn-test" = "every subtest spawns processes, and Emscripten can't spawn processes"
