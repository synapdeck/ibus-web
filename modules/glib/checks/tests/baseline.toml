# name = "reason it cannot run under Node with Emscripten"
[excluded]
"gio - glib:async-close-output-stream" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:async-splice-output-stream" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:cancellable" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:contexts" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:filenamecompleter" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:filter-streams" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:g-icon" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:gdbus-peer" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:gdbus-server-auth" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:iptosmessage" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:pollable" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:proxy-test" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:sleepy-stream" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio - glib:socket" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:socket-listener" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:socket-service" = "no sockets under Node (Emscripten's socket layer needs the ws module); networking is out of scope"
"gio - glib:task" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"gio+no-valgrind - glib:gio-tool.py" = "no process spawning under Emscripten"
"glib+core - glib:gwakeup" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"glib+core - glib:io-channel-basic" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"glib+core - glib:mainloop" = "blocking main-context iteration is unsupported; the runtime only iterates without blocking"
"glib+core - glib:mapping" = "no process spawning under Emscripten"
"glib+core - glib:protocol" = "no process spawning under Emscripten"
"glib+core - glib:spawn-multithreaded" = "no process spawning under Emscripten"
"glib+core - glib:spawn-path-search" = "no process spawning under Emscripten"
"glib+core - glib:spawn-singlethread" = "no process spawning under Emscripten"
"glib+core - glib:spawn-test" = "no process spawning under Emscripten"
"glib+core - glib:test-printf" = "pipes are not supported under Emscripten"
"glib+core - glib:testing" = "no process spawning under Emscripten"
"glib+core+no-valgrind - glib:assert-msg-test.py" = "no process spawning under Emscripten"
