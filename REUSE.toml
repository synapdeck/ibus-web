version = 1

# Matches the upstream ibus-engines.hangul recipe's meta.license.
[[annotations]]
path = "engines/hangul/**"
SPDX-FileCopyrightText = "2026 Synapdeck, Inc."
SPDX-License-Identifier = "GPL-2.0-or-later"
precedence = "override"

[[annotations]]
path = "engines/hangul/patches/**/*.patch"
SPDX-FileCopyrightText = ["The ibus-hangul authors", "2026 Synapdeck, Inc."]
SPDX-License-Identifier = "GPL-2.0-or-later"

# libhangul's own licence, which the engine-wide annotations above would
# otherwise override; the last matching annotation wins.
[[annotations]]
path = "engines/hangul/patches/libhangul/*.patch"
SPDX-FileCopyrightText = ["2005-2009 Choe Hwanjin", "2026 Synapdeck, Inc."]
SPDX-License-Identifier = "LGPL-2.1-or-later"
precedence = "override"

# Matches the upstream ibus-engines.m17n recipe's meta.license.
[[annotations]]
path = "engines/m17n/**"
SPDX-FileCopyrightText = "2026 Synapdeck, Inc."
SPDX-License-Identifier = "GPL-2.0-or-later"
precedence = "override"

[[annotations]]
path = "engines/m17n/patches/**/*.patch"
SPDX-FileCopyrightText = ["The ibus-m17n authors", "2026 Synapdeck, Inc."]
SPDX-License-Identifier = "GPL-2.0-or-later"

# m17n-lib's own licence, which the engine-wide annotations above would
# otherwise override; the last matching annotation wins.
[[annotations]]
path = "engines/m17n/patches/m17n-lib/**/*.patch"
SPDX-FileCopyrightText = [
  "National Institute of Advanced Industrial Science and Technology (AIST)",
  "2026 Synapdeck, Inc.",
]
SPDX-License-Identifier = "LGPL-2.1-or-later"
precedence = "override"

[[annotations]]
path = "engines/mozc/patches/**/*.patch"
SPDX-FileCopyrightText = ["Google Inc.", "2026 Synapdeck, Inc."]
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "tools/cast-audit/fixtures/*.sarif"
SPDX-FileCopyrightText = "2026 Synapdeck, Inc."
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = [
  "docs/**",
  "README.md",
  "CONTRIBUTING.md",
  "AGENTS.md",
  "CLAUDE.md",
  "SECURITY.md",
  "modules/**/README.md",
  "packages/**/README.md",
  "examples/**/README.md",
  "runtime/**/README.md",
  "tools/**/README.md",
  ".clang-format",
  ".gitignore",
  "modules/testing/fixtures/*.args",
  "modules/toolchain/expected-features.txt",
]
SPDX-FileCopyrightText = "2026 Synapdeck, Inc."
SPDX-License-Identifier = "MIT OR Apache-2.0"
# Docs quote SPDX tags in prose, so file contents must not be scanned.
precedence = "override"

# npm and pnpm parse package.json as strict JSON, which has no comments.
[[annotations]]
path = ["package.json", "**/package.json"]
SPDX-FileCopyrightText = "2026 Synapdeck, Inc."
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["flake.lock", "pnpm-lock.yaml"]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "modules/glib/patches/*.patch"
SPDX-FileCopyrightText = [
  "The GLib authors",
  "2026 Synapdeck, Inc.",
  "Jorge Zapata <jorgeluis.zapata@gmail.com>",
  "Kleis Auke Wolthuizen <github@kleisauke.nl>",
]
SPDX-License-Identifier = "LGPL-2.1-or-later"
# Patches 0008 and 0014 add files that carry their own SPDX tags inside
# the diff.
precedence = "override"

[[annotations]]
path = "modules/emscripten/patches/*.patch"
SPDX-FileCopyrightText = ["Emscripten authors", "2026 Synapdeck, Inc."]
SPDX-License-Identifier = "MIT OR NCSA"

# Generated from Nix: the workflow's generator writes a header of its own,
# and the YAML generator writes no comments.
[[annotations]]
path = [".github/workflows/*.yml", "pnpm-workspace.yaml"]
SPDX-FileCopyrightText = "2026 Synapdeck, Inc."
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Claude Code's manifests are strict JSON.
[[annotations]]
path = [
  ".claude/settings.json",
  ".claude-plugin/marketplace.json",
  "tools/claude/*/.claude-plugin/plugin.json",
  ".zed/settings.json",
]
SPDX-FileCopyrightText = "2026 Synapdeck, Inc."
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Upstream IBus and its GDK-derived key helpers retain their original headers.
[[annotations]]
path = ["runtime/libibus-web/include/ibus-1.0/**", "runtime/libibus-web/src/ibus/**"]
SPDX-FileCopyrightText = [
  "2008-2015 Peng Huang <shawn.p.huang@gmail.com>",
  "2008-2015 Red Hat, Inc.",
  "1995-1997 Peter Mattis, Spencer Kimball and Josh MacDonald",
  "The IBus authors",
]
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = "packages/core/src/keys/keysyms.generated.ts"
SPDX-FileCopyrightText = ["1987, 1994, 1998 The Open Group", "1987 Digital Equipment Corporation"]
SPDX-License-Identifier = "MIT-open-group AND HPND"
precedence = "override"

[[annotations]]
path = "packages/core/src/keys/dom-codes.generated.ts"
SPDX-FileCopyrightText = "2013 The Chromium Authors"
SPDX-License-Identifier = "BSD-3-Clause"
precedence = "override"

[[annotations]]
path = "NOTICES/keysymdef.txt"
SPDX-FileCopyrightText = ["1987, 1994, 1998 The Open Group", "1987 Digital Equipment Corporation"]
SPDX-License-Identifier = "MIT-open-group AND HPND"
precedence = "override"

[[annotations]]
path = "NOTICES/chromium.txt"
SPDX-FileCopyrightText = "2015 The Chromium Authors"
SPDX-License-Identifier = "BSD-3-Clause"
precedence = "override"

# The source distributes a collection of permissive notices in COPYING.
[[annotations]]
path = "packages/core/src/keys/us.generated.ts"
SPDX-FileCopyrightText = "The xkeyboard-config contributors"
SPDX-License-Identifier = "LicenseRef-xkeyboard-config"
precedence = "override"
