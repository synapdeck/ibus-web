# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: release
jobs:
  npm:
    if: '!cancelled() && (needs.release.result == ''success'' || github.event_name == ''workflow_dispatch'')'
    name: Publish to npm
    needs:
      - release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.11.1
      - if: github.event_name == 'push'
        name: Download the npm tarballs
        uses: actions/download-artifact@v8.0.2
        with:
          name: npm
          path: npm
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        if: github.event_name == 'workflow_dispatch'
        name: Download the release's npm tarballs
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir npm
      - name: Publish
        run: |
          # A bare relative path is read as GitHub's owner/repo shorthand.
          for tarball in ./npm/*.tgz; do
            spec=$(tar -xOzf "$tarball" package/package.json | jq -r '.name + "@" + .version')
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "$spec is already published"
            else
              npm publish "$tarball" --access public
            fi
          done
    timeout-minutes: 30
  release:
    if: github.event_name == 'push'
    name: Release
    permissions:
      contents: write
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Allow unprivileged user namespaces
        run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Build
        run: nix build .#release -L --max-jobs 1 -o release
      - name: Check the tag against the version
        run: test "v$(nix eval --raw .#release.passthru.version)" = "$GITHUB_REF_NAME"
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release/notes.md release/assets/*
      - name: Collect the npm tarballs
        run: mkdir npm && cp release/assets/*.tgz npm/
      - name: Upload the npm tarballs
        uses: actions/upload-artifact@v7.0.2
        with:
          if-no-files-found: error
          name: npm
          path: npm/*.tgz
    timeout-minutes: 360
name: Release
"on":
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v1.2.3
        required: true
        type: string
permissions:
  contents: read
