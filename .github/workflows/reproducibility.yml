# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  rebuild:
    name: Rebuild the release
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Allow unprivileged user namespaces
        run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Build
        run: nix build .#ibus-runtime .#ibus-web-hangul .#ibus-web-m17n .#ibus-web-mozc .#ibus-web-rime .#ibus-web-table -L --max-jobs 1 --no-link
      - name: Rebuild
        run: nix build --rebuild .#ibus-runtime .#ibus-web-hangul .#ibus-web-m17n .#ibus-web-mozc .#ibus-web-rime .#ibus-web-table -L --max-jobs 1 --no-link
      - if: hashFiles('packages/ibus-web/CHANGELOG.md') != ''
        name: Rebuild the release
        run: nix build .#release -L --max-jobs 1 --no-link && nix build --rebuild .#release -L --max-jobs 1 --no-link
    timeout-minutes: 360
name: Reproducibility
"on":
  schedule:
    - cron: 17 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
