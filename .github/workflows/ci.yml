# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
jobs:
  changesets:
    if: github.event_name == 'pull_request'
    name: Changeset
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        name: Check
        run: |
          shipped=$(git diff --name-only "$BASE"...HEAD -- ':(top)packages/core/' ':(top)packages/ibus-web/' ':(top)packages/panel/' ':(top)packages/protocol/' ':(top)packages/runtime/' ':(top)packages/worker-host/' ':(top)packages/engines/hangul/' ':(top)packages/engines/m17n/' ':(top)packages/engines/mozc/' ':(top)packages/engines/rime/' ':(top)packages/engines/table/' ':(top)runtime/' ':(top)engines/' ':(top)modules/' ':(exclude,top)modules/flake/' ':(exclude,top,glob)**/test/**' ':(exclude,top,glob)**/checks/**')
          if [ -z "$shipped" ]; then
            echo "Nothing a release ships changed."
          elif git diff --name-only --diff-filter=AD "$BASE"...HEAD -- '.changeset/*.md' | grep -q .; then
            echo "A changeset covers this change."
          else
            echo "::error::This changes what a release ships but adds no changeset. Run \`changeset\`, or \`changeset --empty\` if it needs no release note."
            printf '%s\n' "$shipped"
            exit 1
          fi
    timeout-minutes: 5
  check-aarch64-darwin:
    name: nix flake check (aarch64-darwin)
    permissions:
      contents: read
      id-token: write
    runs-on: warp-macos-26-arm64-6x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Check
        run: nix flake check -L --system aarch64-darwin --max-jobs 1
    timeout-minutes: 360
  check-aarch64-linux:
    name: nix flake check (aarch64-linux)
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-arm64-8x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Allow unprivileged user namespaces
        run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Check
        run: nix flake check -L --system aarch64-linux --max-jobs 1
    timeout-minutes: 360
  check-x86_64-linux:
    name: nix flake check (x86_64-linux)
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Allow unprivileged user namespaces
        run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Check
        run: nix flake check -L --system x86_64-linux --max-jobs 1
    timeout-minutes: 360
  integration:
    name: extended integration
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Allow unprivileged user namespaces
        run: if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Check
        run: nix build .#integration-checks -L --max-jobs 1
    timeout-minutes: 360
  playwright-macos:
    name: Playwright (aarch64-darwin)
    needs:
      - check-aarch64-darwin
    permissions:
      contents: read
      id-token: write
    runs-on: warp-macos-26-arm64-6x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Check
        run: nix build .#packages.aarch64-darwin.playwright-integration -L --max-jobs 1
    timeout-minutes: 360
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Publish to FlakeHub
    needs:
      - check-aarch64-darwin
      - check-aarch64-linux
      - check-x86_64-linux
      - integration
      - playwright-macos
      - safari
    permissions:
      contents: read
      id-token: write
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Publish
        uses: DeterminateSystems/flakehub-push@v7
        with:
          name: synapdeck/ibus-web
          rolling: true
          visibility: ${{ github.event.repository.private && 'private' || 'public' }}
    timeout-minutes: 30
  safari:
    name: Safari smoke
    needs:
      - check-aarch64-darwin
    permissions:
      contents: read
      id-token: write
    runs-on: warp-macos-26-arm64-6x
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
      - name: Use FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.23.0
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - name: Smoke
        run: nix run .#safari-smoke -L
    timeout-minutes: 360
name: CI
"on":
  pull_request: {}
  push:
    branches:
      - master
permissions:
  contents: read
