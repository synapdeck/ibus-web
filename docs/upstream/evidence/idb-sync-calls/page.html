<!doctype html>
<meta charset="utf-8" />
<title>IndexedDB strict commits</title>
<script type="module">
  // The stores and the transactions' shape are the WasmFS IndexedDB backend's:
  // a write puts a chunk and its inode's record; fsync() is a strict
  // transaction over both stores.
  const settled = (request) =>
    new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });

  const completed = (transaction) =>
    new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onabort = () => reject(transaction.error);
    });

  let db;

  globalThis.openDatabase = async () => {
    const request = indexedDB.open("idb-sync-calls", 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore("inodes");
      request.result.createObjectStore("chunks");
    };
    db = await settled(request);
  };

  // variant: "relaxed-only" | "empty-strict" | "put-strict".
  globalThis.measure = async (variant, rounds) => {
    // Random bytes, so that no store compresses the chunk away.
    const chunk = crypto.getRandomValues(new Uint8Array(16384));
    let strictMs = 0;
    for (let round = 0; round < rounds; round++) {
      const write = db.transaction(["inodes", "chunks"], "readwrite");
      write.objectStore("chunks").put(chunk.slice().buffer, [1, round]);
      write.objectStore("inodes").put({ size: (round + 1) * chunk.length }, 1);
      await completed(write);
      if (variant === "relaxed-only") continue;
      const start = performance.now();
      const strict = db.transaction(["inodes", "chunks"], "readwrite", { durability: "strict" });
      if (variant === "put-strict") {
        const inodes = strict.objectStore("inodes");
        const read = inodes.get(1);
        read.onsuccess = () => inodes.put(read.result, 1);
      }
      await completed(strict);
      strictMs += performance.now() - start;
    }
    return { strictMeanMs: strictMs / rounds };
  };
</script>
